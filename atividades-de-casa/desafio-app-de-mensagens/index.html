<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <title>Mensageiros</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="fundo">
        </div>
        <div class="app">
            <aside class="painel-contatos">
                <header>
                    <img class="foto-perfil" src="img/hikkoshi_woman.png">
                </header>
                <input type="text" placeholder=" 🔍 buscar contato">
                <ul class="contatos-selecionado">
                    <li>
                        <img class="foto-perfil" src="/img/animal_chara_computer_neko.png">
                        <article>
                            <h4>Camila</h4>
                            <p>Bom dia :)</p>
                            <time class="hora" datetime="14:31">14:30</time>
                        </article>
                    </li>
                </ul>
                <ul class="contatos">
                    <li>
                        <img class="foto-perfil" src="img/hikkoshi_woman.png">
                        <article>
                            <h4>Você</h4>
                        </article>
                    </li>
                </ul>
            </aside>
            <main class="painel-mensagens">
                <header>
                    <img class="foto-perfil" src="/img/animal_chara_computer_neko.png">
                    <h4>Camila</h4>
                </header>
                <section>
                    <article class="data">
                        <time datetime="2026-08-16">hoje</time>
                    </article>
                    <article class="mensagem">
                        <p>Oi Camila!</p>
                        <time class="hora" datetime="14:30">14:30</time>
                    </article>
                    <article class="mensagem">
                        <p>Bom dia :)</p>
                        <time class="hora" datetime="14:31">14:31</time>
                    </article>
                </section>
                <footer>
                    <button id="emoji">🙂</button>​
                    <input id= "conteudo-mensagem" type="text" id="conteudo-mensagem">
                    <button id="anexo">📎</button>​
                    <button id="enviar">➡️​</button>​
                </footer>
            </main>
        </div>
        <script src="script.js"></script>
    </body>


</html>
